<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Veterinary Pet Records System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="login-icon">
                🐾
            </div>

            <div class="login-heading">
                <p class="system-label">
                    VETERINARY PET RECORDS SYSTEM
                </p>

                <h1>System Login</h1>

                <p>
                    Sign in using your authorized account.
                </p>
            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>


                <p
                    id="loginMessage"
                    class="login-message"
                ></p>

            </form>


            <div class="login-footer">

                <span>
                    Authorized Personnel Only
                </span>

            </div>

        </section>

    </main>


    <script src="js/login.js"></script>

</body>
</html>
